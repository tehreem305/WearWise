
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | WearWise</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">Wear<span>Wise.</span></a>
            <a href="login.html" class="login-btn">Login</a>
        </div>
    </nav>

    <section class="auth-section">
        <div class="auth-card">
            <span class="section-tag">JOIN WEARWISE</span>
            <h1>Create Your Account</h1>
            <p>Start organizing your wardrobe and discovering your style.</p>

            <form>
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" placeholder="Enter your full name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="Enter your email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="Create a password" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" placeholder="Confirm your password" required>
                </div>

                <button type="submit" class="primary-btn w-100 border-0">Create Account</button>
            </form>

            <p class="auth-bottom">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

            <a href="index.html" class="back-link">← Back to Home</a>
        </div>
    </section>

</body>
</html>
