
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | WearWise</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">Wear<span>Wise.</span></a>
            <a href="signup.html" class="signup-btn">Create Account</a>
        </div>
    </nav>

    <section class="auth-section">
        <div class="auth-card">
            <span class="section-tag">WELCOME BACK</span>
            <h1>Login to Your Wardrobe</h1>
            <p>Continue your personal style journey with WearWise.</p>

            <form>
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="Enter your email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="Enter your password" required>
                </div>

                <div class="form-check mb-4">
                    <input type="checkbox" class="form-check-input" id="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>

                <button type="submit" class="primary-btn w-100 border-0">Login to WearWise</button>
            </form>

            <p class="auth-bottom">
                Don't have an account?
                <a href="signup.html">Create one</a>
            </p>

            <a href="index.html" class="back-link">← Back to Home</a>
        </div>
    </section>

</body>
</html>
